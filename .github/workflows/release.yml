name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Build release
      run: cargo build --release --workspace

    - name: Upload binary to release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ matrix.os == 'windows-latest' && 'target/release/ayeneh-tui.exe' || 'target/release/ayeneh-tui' }}
          ${{ matrix.os == 'windows-latest' && 'target/release/ayeneh-cli.exe' || 'target/release/ayeneh-cli' }}
        fail_on_unmatched_files: true
