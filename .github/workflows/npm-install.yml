name: JS Package Management Support

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  npm-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ 20, 22, 24 ]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build mirror-cli
      run: cargo build --release -p mirror-cli

    - name: Setup Node ${{ matrix.node }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}

    - name: Prepare example npm project
      run: |
        mkdir -p /tmp/npmtest
        cat > /tmp/npmtest/package.json <<'EOF'
        {
          "name": "mirror-cli-example",
          "version": "1.0.0",
          "description": "Example project to test mirror-cli npm install",
          "main": "index.js",
          "dependencies": {
            "lodash": "^4.17.21",
            "chalk": "^4.1.2",
            "is-odd": "^3.0.1"
          }
        }
        EOF

    - name: Install packages via mirrors
      working-directory: /tmp/npmtest
      env:
        MIRROR_DATA_DIR: ${{ github.workspace }}/data
      run: |
        "${{ github.workspace }}/target/release/mirror-cli" npm install

    - name: Verify installed packages work
      working-directory: /tmp/npmtest
      run: |
        node -e "console.log(require('lodash').capitalize('hello world'))"
        node -e "console.log(require('is-odd')(3))"
        node -e "require('chalk')"
